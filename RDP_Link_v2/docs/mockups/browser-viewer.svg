<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="1440" height="900" fill="#F5F5F5"/>
  <!-- header toolbar -->
  <rect width="1440" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="1440" y2="56" stroke="#F0F0F0"/>
  <rect x="16" y="15" width="26" height="26" rx="6" fill="#1677FF"/>
  <text x="50" y="34" font-size="16" font-weight="600" fill="#1F1F1F">RDP <tspan fill="#1677FF">Link</tspan></text>
  <rect x="160" y="17" width="150" height="22" rx="4" fill="#F6FFED" stroke="#B7EB8F"/>
  <text x="235" y="32" font-size="12" fill="#389E0D" text-anchor="middle">1920×1080 · 30 fps</text>
  <text x="330" y="33" font-size="13" fill="#595959">Display</text>
  <rect x="380" y="16" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="415" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">Display 1</text>
  <!-- zoom slider -->
  <text x="470" y="33" font-size="13" fill="#595959">Zoom</text>
  <rect x="510" y="26" width="180" height="4" rx="2" fill="#F0F0F0"/>
  <rect x="510" y="26" width="90" height="4" rx="2" fill="#1677FF"/>
  <circle cx="600" cy="28" r="7" fill="#1677FF"/>
  <text x="700" y="33" font-size="12" fill="#1F1F1F">100%</text>
  <rect x="740" y="16" width="28" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="754" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">Fit</text>
  <rect x="772" y="16" width="28" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="786" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">Fill</text>
  <rect x="1200" y="16" width="36" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1218" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">⛶</text>
  <rect x="1244" y="16" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1284" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">Devices</text>
  <rect x="1332" y="16" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1372" y="33" font-size="12" fill="#1F1F1F" text-anchor="middle">Clipboard</text>
  <rect x="1420" y="16" width="0" height="0"/>
  <!-- disconnect -->
  <rect x="1080" y="16" width="100" height="24" rx="6" fill="#FFFFFF" stroke="#FFCCC7"/>
  <text x="1130" y="33" font-size="12" fill="#CF1322" text-anchor="middle">Disconnect</text>
  <!-- stage -->
  <rect x="0" y="56" width="1080" height="780" fill="#F0F0F0"/>
  <rect x="40" y="80" width="1000" height="620" rx="4" fill="#000000"/>
  <text x="540" y="395" font-size="16" fill="#FFFFFF" text-anchor="middle">Remote screen (1920×1080)</text>
  <!-- bottom key bar -->
  <rect x="0" y="820" width="1080" height="40" fill="#FFFFFF"/>
  <line x1="0" y1="820" x2="1080" y2="820" stroke="#F0F0F0"/>
  <g font-size="12" fill="#1F1F1F">
    <rect x="12" y="828" width="36" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="30" y="844" text-anchor="middle">Esc</text>
    <rect x="56" y="828" width="36" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="74" y="844" text-anchor="middle">Tab</text>
    <rect x="100" y="828" width="52" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="126" y="844" text-anchor="middle">Enter</text>
    <rect x="160" y="828" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="172" y="844" text-anchor="middle">←</text>
    <rect x="188" y="828" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="200" y="844" text-anchor="middle">↑</text>
    <rect x="216" y="828" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="228" y="844" text-anchor="middle">↓</text>
    <rect x="244" y="828" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="256" y="844" text-anchor="middle">→</text>
    <rect x="276" y="828" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/><text x="316" y="844" text-anchor="middle">More keys ▾</text>
  </g>
  <!-- devices drawer -->
  <rect x="1080" y="56" width="360" height="844" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="1100" y="84" font-size="16" font-weight="600" fill="#1F1F1F">Devices</text>
  <rect x="1404" y="66" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1416" y="83" font-size="12" fill="#1F1F1F" text-anchor="middle">✕</text>
  <!-- drawer tabs -->
  <g font-size="12" fill="#595959">
    <text x="1100" y="112">Audio</text>
    <rect x="1096" y="118" width="44" height="3" rx="1.5" fill="#1677FF"/>
    <text x="1160" y="112">Camera</text>
    <text x="1220" y="112">Serial</text>
    <text x="1276" y="112">Ports</text>
    <text x="1332" y="112">Files</text>
    <text x="1384" y="112">Clip</text>
  </g>
  <line x1="1080" y1="124" x2="1440" y2="124" stroke="#F0F0F0"/>
  <!-- audio content -->
  <text x="1100" y="150" font-size="14" font-weight="600" fill="#1F1F1F">Speaker (host audio)</text>
  <rect x="1100" y="160" width="60" height="28" rx="6" fill="#1677FF"/>
  <text x="1130" y="179" font-size="12" fill="#FFFFFF" text-anchor="middle">Play</text>
  <rect x="1168" y="160" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1198" y="179" font-size="12" fill="#1F1F1F" text-anchor="middle">Stop</text>
  <text x="1100" y="200" font-size="11" fill="#8C8C8C">Stopped</text>
  <line x1="1096" y1="216" x2="1424" y2="216" stroke="#F0F0F0"/>
  <text x="1100" y="240" font-size="14" font-weight="600" fill="#1F1F1F">Microphone (this device → host)</text>
  <rect x="1100" y="250" width="60" height="28" rx="6" fill="#1677FF"/>
  <text x="1130" y="269" font-size="12" fill="#FFFFFF" text-anchor="middle">Start</text>
  <rect x="1168" y="250" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1198" y="269" font-size="12" fill="#1F1F1F" text-anchor="middle">Stop</text>
  <text x="1100" y="290" font-size="11" fill="#8C8C8C">Stopped. Requires HTTPS or localhost.</text>
  <line x1="1096" y1="306" x2="1424" y2="306" stroke="#F0F0F0"/>
  <text x="1100" y="330" font-size="14" font-weight="600" fill="#1F1F1F">Camera (host)</text>
  <rect x="1100" y="340" width="300" height="120" rx="6" fill="#FAFAFA" stroke="#F0F0F0"/>
  <text x="1250" y="405" font-size="12" fill="#8C8C8C" text-anchor="middle">host camera preview</text>
  <rect x="1100" y="470" width="60" height="28" rx="6" fill="#1677FF"/>
  <text x="1130" y="489" font-size="12" fill="#FFFFFF" text-anchor="middle">Start</text>
  <rect x="1168" y="470" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1198" y="489" font-size="12" fill="#1F1F1F" text-anchor="middle">Stop</text>
  <text x="720" y="885" font-size="12" fill="#8C8C8C" text-anchor="middle">Mockup: browser viewer with zoom slider, tabbed devices sheet</text>
</svg>
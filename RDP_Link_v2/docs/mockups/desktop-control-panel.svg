<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="1280" height="800" fill="#F5F5F5"/>
  <!-- header -->
  <rect width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#F0F0F0"/>
  <rect x="24" y="17" width="30" height="30" rx="7" fill="#1677FF"/>
  <text x="62" y="38" font-size="18" font-weight="600" fill="#1F1F1F">RDP <tspan fill="#1677FF">Link</tspan></text>
  <rect x="1080" y="21" width="90" height="22" rx="4" fill="#F6FFED" stroke="#B7EB8F"/>
  <text x="1125" y="36" font-size="12" fill="#389E0D" text-anchor="middle">Sharing</text>
  <rect x="1180" y="16" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1220" y="37" font-size="13" fill="#1F1F1F" text-anchor="middle">Open viewer</text>
  <!-- tabs -->
  <rect x="0" y="64" width="1280" height="44" fill="#FFFFFF"/>
  <line x1="0" y1="108" x2="1280" y2="108" stroke="#F0F0F0"/>
  <g font-size="14" fill="#595959">
    <text x="40" y="92">Share</text>
    <rect x="24" y="104" width="52" height="4" rx="2" fill="#1677FF"/>
    <text x="120" y="92">Connect</text>
    <text x="220" y="92">Devices</text>
    <text x="320" y="92">Files</text>
    <text x="400" y="92">Settings</text>
  </g>
  <!-- main grid -->
  <!-- Share card -->
  <rect x="24" y="128" width="580" height="560" rx="8" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="48" y="160" font-size="16" font-weight="600" fill="#1F1F1F">This device</text>
  <text x="48" y="192" font-size="13" fill="#595959">RDP Link ID</text>
  <rect x="48" y="200" width="420" height="36" rx="6" fill="#FAFAFA" stroke="#F0F0F0"/>
  <text x="60" y="224" font-size="22" font-weight="600" font-family="monospace" fill="#1F1F1F">123 456 789</text>
  <rect x="476" y="204" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="506" y="223" font-size="12" fill="#1F1F1F" text-anchor="middle">Copy</text>
  <text x="48" y="256" font-size="13" fill="#595959">LAN address</text>
  <rect x="48" y="264" width="420" height="32" rx="6" fill="#FAFAFA" stroke="#F0F0F0"/>
  <text x="60" y="285" font-size="13" font-family="monospace" fill="#1F1F1F">192.168.1.20:8088</text>
  <rect x="476" y="266" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="506" y="285" font-size="12" fill="#1F1F1F" text-anchor="middle">Copy</text>
  <text x="48" y="316" font-size="13" fill="#595959">WAN address</text>
  <rect x="48" y="324" width="420" height="32" rx="6" fill="#FAFAFA" stroke="#F0F0F0"/>
  <text x="60" y="345" font-size="13" font-family="monospace" fill="#1F1F1F">203.0.113.7:8088</text>
  <rect x="476" y="326" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="506" y="345" font-size="12" fill="#1F1F1F" text-anchor="middle">Copy</text>
  <text x="48" y="376" font-size="13" fill="#595959">Access password</text>
  <rect x="48" y="384" width="300" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="60" y="405" font-size="13" font-family="monospace" fill="#1F1F1F">••••••</text>
  <rect x="356" y="386" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="386" y="405" font-size="12" fill="#1F1F1F" text-anchor="middle">Show</text>
  <rect x="424" y="386" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="454" y="405" font-size="12" fill="#1F1F1F" text-anchor="middle">Copy</text>
  <rect x="48" y="440" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#FFCCC7"/>
  <text x="118" y="461" font-size="13" fill="#CF1322" text-anchor="middle">Stop sharing</text>
  <text x="48" y="496" font-size="12" fill="#595959">Guests connect with the RDP Link ID or LAN address. Every request needs this password.</text>
  <!-- Connect card -->
  <rect x="628" y="128" width="628" height="360" rx="8" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="652" y="160" font-size="16" font-weight="600" fill="#1F1F1F">Connect to a device</text>
  <text x="652" y="192" font-size="13" fill="#595959">Address, or 9-digit RDP Link ID</text>
  <rect x="652" y="200" width="580" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="664" y="221" font-size="13" fill="#8C8C8C">192.168.1.20:8088 or 123 456 789</text>
  <text x="652" y="252" font-size="13" fill="#595959">Password</text>
  <rect x="652" y="260" width="580" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <rect x="652" y="308" width="100" height="32" rx="6" fill="#1677FF"/>
  <text x="702" y="329" font-size="13" fill="#FFFFFF" text-anchor="middle">Connect</text>
  <rect x="760" y="308" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="820" y="329" font-size="13" fill="#1F1F1F" text-anchor="middle">Paste clipboard</text>
  <text x="652" y="360" font-size="12" fill="#595959">Recent devices</text>
  <rect x="652" y="368" width="580" height="24" rx="4" fill="#E6F4FF"/>
  <text x="664" y="385" font-size="12" fill="#1677FF">http://192.168.1.5:8088</text>
  <rect x="652" y="396" width="580" height="24" rx="4" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="664" y="413" font-size="12" fill="#1F1F1F">http://10.0.0.8:8088</text>
  <!-- Settings teaser card -->
  <rect x="628" y="508" width="628" height="180" rx="8" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="652" y="540" font-size="16" font-weight="600" fill="#1F1F1F">Settings (tab)</text>
  <text x="652" y="568" font-size="13" fill="#595959">Port, rendezvous relay URL, permissions modal, display defaults.</text>
  <rect x="652" y="588" width="160" height="32" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="732" y="609" font-size="13" fill="#1F1F1F" text-anchor="middle">Setup &amp; permissions</text>
  <!-- caption -->
  <text x="640" y="770" font-size="12" fill="#8C8C8C" text-anchor="middle">Mockup: proposed desktop/browser control panel with top tabs (Share active)</text>
</svg>
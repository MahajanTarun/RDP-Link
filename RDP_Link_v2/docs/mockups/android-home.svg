<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="390" height="844" fill="#F5F5F5"/>
  <!-- header -->
  <rect width="390" height="110" fill="#FFFFFF"/>
  <line x1="0" y1="110" x2="390" y2="110" stroke="#F0F0F0"/>
  <rect x="16" y="20" width="28" height="28" rx="6" fill="#1677FF"/>
  <text x="52" y="34" font-size="16" font-weight="600" fill="#1F1F1F">RDP <tspan fill="#1677FF">Link</tspan></text>
  <text x="52" y="54" font-size="12" fill="#595959">Remote access to your own devices</text>
  <text x="16" y="80" font-size="11" fill="#595959">RDP Link ID</text>
  <text x="16" y="100" font-size="18" font-weight="600" font-family="monospace" fill="#1F1F1F">123 456 789</text>
  <rect x="300" y="82" width="74" height="26" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="337" y="99" font-size="12" fill="#1F1F1F" text-anchor="middle">Copy</text>
  <!-- content scroll -->
  <!-- Share card -->
  <rect x="16" y="126" width="358" height="230" rx="8" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="32" y="152" font-size="15" font-weight="600" fill="#1F1F1F">Share this screen  ▾</text>
  <text x="32" y="172" font-size="12" fill="#595959">Start sharing, then approve the capture prompt.</text>
  <text x="32" y="196" font-size="12" fill="#595959">Access password</text>
  <rect x="32" y="202" width="230" height="34" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="42" y="224" font-size="13" font-family="monospace" fill="#1F1F1F">••••••</text>
  <rect x="270" y="202" width="50" height="34" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="295" y="224" font-size="12" fill="#1F1F1F" text-anchor="middle">New</text>
  <rect x="32" y="246" width="326" height="30" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="195" y="266" font-size="12" fill="#595959" text-anchor="middle">Advanced settings ▾</text>
  <rect x="32" y="286" width="326" height="30" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="195" y="306" font-size="12" fill="#595959" text-anchor="middle">Enable remote control (accessibility)</text>
  <rect x="32" y="326" width="326" height="22" rx="4" fill="#F6FFED" stroke="#B7EB8F"/>
  <text x="195" y="341" font-size="11" fill="#389E0D" text-anchor="middle">Idle</text>
  <!-- Connect card -->
  <rect x="16" y="372" width="358" height="200" rx="8" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="32" y="398" font-size="15" font-weight="600" fill="#1F1F1F">Connect to a device  ▾</text>
  <rect x="32" y="412" width="326" height="34" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="42" y="434" font-size="12" fill="#8C8C8C">192.168.1.20:8088 or 123 456 789</text>
  <text x="32" y="462" font-size="12" fill="#595959">Recent devices</text>
  <rect x="32" y="470" width="326" height="22" rx="4" fill="#E6F4FF"/>
  <text x="42" y="486" font-size="11" fill="#1677FF">http://192.168.1.5:8088</text>
  <rect x="32" y="496" width="326" height="22" rx="4" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="42" y="512" font-size="11" fill="#1F1F1F">http://10.0.0.8:8088</text>
  <text x="32" y="540" font-size="11" fill="#8C8C8C">Long-press a recent device to remove it.</text>
  <!-- action bar -->
  <rect x="0" y="600" width="390" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="600" x2="390" y2="600" stroke="#F0F0F0"/>
  <rect x="16" y="612" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="66" y="635" font-size="13" fill="#1F1F1F" text-anchor="middle">Stop</text>
  <rect x="124" y="612" width="120" height="36" rx="6" fill="#1677FF"/>
  <text x="184" y="635" font-size="13" fill="#FFFFFF" text-anchor="middle">Share</text>
  <rect x="252" y="612" width="122" height="36" rx="6" fill="#1677FF"/>
  <text x="313" y="635" font-size="13" fill="#FFFFFF" text-anchor="middle">Connect</text>
  <!-- bottom nav -->
  <rect x="0" y="776" width="390" height="68" fill="#FFFFFF"/>
  <line x1="0" y1="776" x2="390" y2="776" stroke="#F0F0F0"/>
  <g font-size="10" fill="#8C8C8C" text-anchor="middle">
    <circle cx="48" cy="796" r="10" fill="#1677FF"/>
    <text x="48" y="824" fill="#1677FF">Home</text>
    <circle cx="130" cy="796" r="10" fill="#D9D9D9"/>
    <text x="130" y="824">Devices</text>
    <circle cx="212" cy="796" r="10" fill="#D9D9D9"/>
    <text x="212" y="824">Files</text>
    <circle cx="294" cy="796" r="10" fill="#D9D9D9"/>
    <text x="294" y="824">Settings</text>
  </g>
  <text x="195" y="838" font-size="10" fill="#8C8C8C" text-anchor="middle">Mockup: Android home with bottom nav (Home active)</text>
</svg>
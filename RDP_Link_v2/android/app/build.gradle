plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def env = System.getenv()
def keystoreFile = env["OFFICERDP_KEYSTORE_FILE"] ?: "officerdp.keystore"
def keystorePassword = env["OFFICERDP_KEYSTORE_PASSWORD"]

android {
    namespace 'com.eminentailabs.officerdp'
    compileSdk 36
    defaultConfig {
        applicationId "com.eminentailabs.officerdp"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "0.2.1"
        resourceConfigurations += ["en"]
    }

    signingConfigs {
        create("store") {
            if (keystorePassword != null) {
                storeFile = file(keystoreFile)
                storePassword keystorePassword
                keyAlias env["OFFICERDP_KEY_ALIAS"]
                keyPassword env["OFFICERDP_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePassword != null && file(keystoreFile).exists()) {
                signingConfig signingConfigs.getByName("store")
            } else {
                // Local installable release build; replace with a real keystore for stores.
                signingConfig signingConfigs.debug
            }
        }
    }

    // The lint task in this Gradle/AGP combination crashes inside UAST on JDK 17.
    // Lint runs in its own CI job (android-lint) with a compatible toolchain instead.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // Go core (identity, peer id) bound with gomobile. Optional: without the
    // AAR the app falls back to a Kotlin-derived peer id.
    if (file('libs/mobile.aar').exists()) {
        implementation files('libs/mobile.aar')
    }
}

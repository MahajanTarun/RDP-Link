<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RDP Link — Viewer</title>
<style>
  /* Ant Design 5 light palette + Tailwind-style spacing utilities. */
  :root {
    color-scheme: light;
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-active: #0958d9;
    --primary-bg: #e6f4ff;
    --bg-layout: #f5f5f5;
    --bg-container: #ffffff;
    --text: rgba(0, 0, 0, 0.88);
    --text-secondary: rgba(0, 0, 0, 0.65);
    --text-tertiary: rgba(0, 0, 0, 0.45);
    --border: #d9d9d9;
    --border-secondary: #f0f0f0;
    --fill-secondary: rgba(0, 0, 0, 0.06);
    --success: #52c41a;
    --success-text: #389e0d;
    --success-bg: #f6ffed;
    --success-border: #b7eb8f;
    --warning-text: #d48806;
    --warning-bg: #fffbe6;
    --warning-border: #ffe58f;
    --error: #ff4d4f;
    --error-text: #cf1322;
    --error-bg: #fff2f0;
    --error-border: #ffccc7;
    --radius: 6px;
    --radius-lg: 8px;
    --shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02),
              0 2px 4px 0 rgba(0, 0, 0, 0.02);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg-layout); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.5715;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px;
    background: var(--bg-container); border-bottom: 1px solid var(--border-secondary);
    flex-wrap: nowrap; flex-shrink: 0; min-width: 0;
  }
  header > * { flex-shrink: 0; }
  header #status { flex-shrink: 1; min-width: 0; overflow: hidden;
                   text-overflow: ellipsis; }
  header .brand { display: flex; align-items: center; gap: 8px;
                  font-weight: 600; font-size: 16px; letter-spacing: 0; }
  header .brand .mark { width: 26px; height: 26px; border-radius: 6px;
                        object-fit: contain; background: #fff; }
  header .brand .name span { color: var(--primary); }
  #status {
    font-size: 13px; color: var(--text-secondary); padding: 1px 8px;
    border: 1px solid var(--border-secondary); border-radius: 4px;
    background: #fafafa; white-space: nowrap;
  }
  #status.live { color: var(--success-text); background: var(--success-bg);
                 border-color: var(--success-border); }
  #status.warn { color: var(--warning-text); background: var(--warning-bg);
                 border-color: var(--warning-border); }
  #status.error { color: var(--error-text); background: var(--error-bg);
                  border-color: var(--error-border); }
  .spacer { flex: 1; }

  button {
    height: 32px; padding: 0 15px; font-size: 14px; font-family: var(--font);
    color: var(--text); background: var(--bg-container); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.02);
    transition: color .2s, border-color .2s, background .2s, box-shadow .2s;
    white-space: nowrap;
  }
  button:hover { color: var(--primary-hover); border-color: var(--primary-hover); }
  button:active { color: var(--primary-active); border-color: var(--primary-active); }
  button.primary { color: #fff; background: var(--primary); border-color: var(--primary);
                   box-shadow: 0 2px 0 rgba(5, 145, 255, 0.1); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button.primary:active { background: var(--primary-active); border-color: var(--primary-active); }
  button:disabled { color: var(--text-tertiary); background: rgba(0, 0, 0, 0.04);
                    border-color: var(--border); box-shadow: none; cursor: not-allowed; }

  #stage {
    position: relative; flex: 1; overflow: hidden; background: #f0f0f0;
    display: flex; align-items: center; justify-content: center; touch-action: none;
    padding: 12px;
  }
  #frame {
    max-width: 100%; max-height: 100%; display: block; image-rendering: auto;
    cursor: crosshair; border-radius: 2px;
    box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.12), 0 3px 6px -4px rgba(0, 0, 0, 0.12);
    background: #000;
  }
  #stage.actual { overflow: auto; align-items: flex-start; justify-content: flex-start; }
  #stage.actual #frame { max-width: none; max-height: none; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; background: rgba(0, 0, 0, 0.45);
             backdrop-filter: blur(2px); }
  #overlay.hidden { display: none; }
  .card {
    width: min(92vw, 400px); background: var(--bg-container);
    border-radius: var(--radius-lg); padding: 24px;
    box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12),
                0 9px 28px 8px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border-secondary);
  }
  .card h1 { font-size: 18px; line-height: 1.4; margin: 0 0 6px; font-weight: 600; }
  .card p { font-size: 14px; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.5715; }
  .card label { display: block; font-size: 14px; color: var(--text); margin: 0 0 6px; }
  .card input {
    width: 100%; height: 40px; padding: 4px 11px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-container); color: var(--text);
    font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: border-color .2s, box-shadow .2s;
  }
  .card input:hover { border-color: var(--primary-hover); }
  .card input:focus { outline: none; border-color: var(--primary);
                      box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1); }
  .card .actions { display: flex; gap: 8px; margin-top: 20px; }
  .card .actions button { flex: 1; height: 40px; }
  .err { color: var(--error-text); font-size: 13px; min-height: 20px; margin-top: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--bg-container); color: var(--text); border: 1px solid var(--border-secondary);
    padding: 9px 16px; border-radius: var(--radius); font-size: 14px;
    box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12);
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }

  #zoom {
    height: 32px; padding: 0 8px; font-size: 14px; font-family: var(--font);
    color: var(--text); background: var(--bg-container); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
  }
  #zoom:hover { border-color: var(--primary-hover); }
  #zoom:focus { outline: none; border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1); }

  #keys { display: flex; gap: 8px; padding: 8px 12px; background: var(--bg-container);
          border-top: 1px solid var(--border-secondary); overflow-x: auto;
          flex-shrink: 0; }
  #keys button { height: 28px; padding: 0 10px; font-size: 13px; }
  @media (max-width: 760px) {
    header {
      height: auto; min-height: 56px; flex-wrap: wrap;
      padding: 8px 10px; row-gap: 8px;
    }
    header .brand .name { display: none; }
    header #status { flex-shrink: 0; }
    header button { padding: 0 9px; font-size: 13px; }
  }
  @media (max-width: 560px) { #keys { display: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><img class="mark" src="/logo.png" alt="" /><span class="name">RDP <span>Link</span></span></div>
    <div id="status">Not connected</div>
    <div class="spacer"></div>
    <select id="zoom" title="Screen scaling" aria-label="Screen scaling">
      <option value="auto">Auto fit</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
    <button id="btnClip" title="Sync clipboard with host">Clipboard</button>
    <button id="btnFull" title="Fullscreen">Fullscreen</button>
    <button id="btnDisc" disabled>Disconnect</button>
  </header>

  <div id="stage">
    <img id="frame" alt="Remote screen" draggable="false" />
    <div id="overlay">
      <div class="card">
        <h1>Connect to this device</h1>
        <p>Enter the access password shown on the host. The password is kept in
           this browser only.</p>
        <label for="pw">Access password</label>
        <input id="pw" type="password" autocomplete="current-password"
               inputmode="numeric" placeholder="••••••" />
        <div class="err" id="err"></div>
        <div class="actions">
          <button class="primary" id="btnConnect">Connect</button>
          <button id="btnForget">Forget</button>
        </div>
      </div>
    </div>
  </div>

  <div id="keys">
    <button data-key="escape">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="enter">Enter</button>
    <button data-key="backspace">Backspace</button>
    <button data-key="delete">Del</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="home">Home</button>
    <button data-key="end">End</button>
    <button id="btnType">Type text…</button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), stage = $('stage'), overlay = $('overlay');
  const statusEl = $('status'), errEl = $('err'), toastEl = $('toast');
  const pwInput = $('pw');

  const STORE_KEY = 'officerdp.password';
  // A launcher can pass the password in the URL fragment; it never reaches
  // the host's logs or referrer because fragments stay in the browser.
  const hashParams = new URLSearchParams(location.hash.slice(1));
  let password = sessionStorage.getItem(STORE_KEY) || hashParams.get('pw') || '';
  if (hashParams.get('pw')) {
    sessionStorage.setItem(STORE_KEY, hashParams.get('pw'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  let connected = false;
  let zoomMode = 'auto';
  let lastUrl = null;
  let etag = '';
  let frameTimes = [], lastFrameAt = 0;
  let frameW = 0, frameH = 0;

  const toast = (msg) => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  };

  const authHeaders = () => password ? { 'X-Office-Password': password } : {};

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function showOverlay(message) {
    if (message) errEl.textContent = message;
    overlay.classList.remove('hidden');
    pwInput.focus();
  }

  function hideOverlay() {
    errEl.textContent = '';
    overlay.classList.add('hidden');
  }

  async function fetchFrame() {
    const headers = { ...authHeaders(), cache: 'no-store' };
    if (etag) headers['If-None-Match'] = etag;
    const res = await fetch('/frame.jpg', { headers, cache: 'no-store' });
    if (res.status === 401 || res.status === 403) {
      const e = new Error('unauthorized'); e.code = 401; throw e;
    }
    if (res.status === 304) return null;
    if (!res.ok) throw new Error('frame ' + res.status);
    etag = res.headers.get('ETag') || '';
    return await res.blob();
  }

  function applyZoom() {
    if (zoomMode === 'auto') {
      frame.style.width = '';
      frame.style.height = '';
      frame.style.maxWidth = '100%';
      frame.style.maxHeight = '100%';
      stage.classList.remove('actual');
      return;
    }
    const z = Number(zoomMode) || 1;
    frame.style.maxWidth = 'none';
    frame.style.maxHeight = 'none';
    frame.style.width = Math.round(frameW * z) + 'px';
    frame.style.height = Math.round(frameH * z) + 'px';
    stage.classList.add('actual');
  }

  function drawBlob(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        frame.src = url;
        frameW = img.naturalWidth; frameH = img.naturalHeight;
        applyZoom();
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
        resolve(true);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(false); };
      img.src = url;
    });
  }

  async function loop() {
    while (connected) {
      const started = performance.now();
      try {
        const blob = await fetchFrame();
        if (blob) {
          const ok = await drawBlob(blob);
          if (ok) { frameTimes.push(performance.now()); lastFrameAt = Date.now(); }
        }
        if (!overlay.classList.contains('hidden')) hideOverlay();
        if (lastFrameAt && Date.now() - lastFrameAt > 4000) setStatus('Reconnecting…', 'warn');
      } catch (e) {
        if (e.code === 401) {
          connected = false;
          $('btnDisc').disabled = true;
          setStatus('Disconnected', 'error');
          showOverlay('Wrong password or sharing stopped.');
          return;
        }
        setStatus('Reconnecting…', 'warn');
      }
      // No new frame arrived: poll gently. New frame: loop again immediately.
      const elapsed = performance.now() - started;
      await new Promise((r) => setTimeout(r, elapsed < 40 ? 24 : 8));
    }
  }

  setInterval(() => {
    if (!connected) return;
    const cutoff = performance.now() - 2000;
    frameTimes = frameTimes.filter((t) => t >= cutoff);
    const fps = Math.round(frameTimes.length / 2);
    setStatus(`${frameW}×${frameH} · ${fps} fps`, 'live');
  }, 1000);

  function connect() {
    password = pwInput.value.trim();
    if (!password) { errEl.textContent = 'Enter the access password.'; return; }
    sessionStorage.setItem(STORE_KEY, password);
    connected = true;
    $('btnDisc').disabled = false;
    setStatus('Connecting…', 'warn');
    loop();
  }

  async function post(path, body) {
    if (!connected) return null;
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body)
      });
      return res;
    } catch (e) { return null; }
  }

  // -- coordinate mapping ---------------------------------------------------
  function toRemote(ev) {
    const r = frame.getBoundingClientRect();
    if (!frameW || !frameH) return { x: 0, y: 0 };
    const x = Math.round((ev.clientX - r.left) / r.width * frameW);
    const y = Math.round((ev.clientY - r.top) / r.height * frameH);
    return {
      x: Math.max(0, Math.min(frameW - 1, x)),
      y: Math.max(0, Math.min(frameH - 1, y))
    };
  }

  let moveQueued = null, moveTimer = null;
  frame.addEventListener('mousemove', (ev) => {
    moveQueued = toRemote(ev);
    if (moveTimer) return;
    moveTimer = setTimeout(() => {
      moveTimer = null;
      if (moveQueued) post('/input', { type: 'move', ...moveQueued });
    }, 40);
  });

  frame.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    const p = toRemote(ev);
    post('/input', { type: 'click', x: p.x, y: p.y, button: ev.button === 2 ? 3 : 1 });
  });
  frame.addEventListener('contextmenu', (ev) => ev.preventDefault());

  frame.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    post('/input', { type: 'wheel', delta: ev.deltaY > 0 ? -1 : 1 });
  }, { passive: false });

  // -- touch ---------------------------------------------------------------
  let touchStart = null;
  frame.addEventListener('touchstart', (ev) => {
    if (ev.touches.length === 1) {
      const t = ev.touches[0];
      touchStart = { x: t.clientX, y: t.clientY, at: Date.now(), moved: false };
    }
  }, { passive: true });

  frame.addEventListener('touchmove', (ev) => {
    if (!touchStart || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
      touchStart.moved = true;
      post('/input', { type: 'wheel', delta: dy > 0 ? -1 : 1 });
      touchStart.x = t.clientX; touchStart.y = t.clientY;
    }
  }, { passive: true });

  frame.addEventListener('touchend', (ev) => {
    if (!touchStart) return;
    if (!touchStart.moved && Date.now() - touchStart.at < 500) {
      const p = toRemote({ clientX: touchStart.x, clientY: touchStart.y });
      post('/input', { type: 'click', x: p.x, y: p.y, button: 1 });
    }
    touchStart = null;
  }, { passive: true });

  // -- keyboard ------------------------------------------------------------
  const SPECIAL = {
    Enter: 'enter', Backspace: 'backspace', Escape: 'escape', Tab: 'tab',
    Delete: 'delete', Home: 'home', End: 'end', PageUp: 'pageup',
    PageDown: 'pagedown', ArrowUp: 'up', ArrowDown: 'down',
    ArrowLeft: 'left', ArrowRight: 'right', ' ': 'space'
  };

  document.addEventListener('keydown', (ev) => {
    if (!connected || ev.target === pwInput) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return; // keep browser shortcuts
    if (SPECIAL[ev.key]) {
      ev.preventDefault();
      post('/input', { type: 'key', key: SPECIAL[ev.key] });
    } else if (ev.key.length === 1) {
      ev.preventDefault();
      post('/input', { type: 'text', text: ev.key });
    }
  });

  document.querySelectorAll('#keys [data-key]').forEach((btn) => {
    btn.addEventListener('click', () => post('/input', { type: 'key', key: btn.dataset.key }));
  });

  $('btnType').addEventListener('click', () => {
    const text = prompt('Text to type on the remote device:');
    if (text) post('/input', { type: 'text', text });
  });

  // -- clipboard -----------------------------------------------------------
  $('btnClip').addEventListener('click', async () => {
    try {
      const res = await fetch('/clipboard', { headers: authHeaders(), cache: 'no-store' });
      const data = await res.json();
      const text = data.text || '';
      try {
        await navigator.clipboard.writeText(text);
        toast(text ? 'Host clipboard copied' : 'Host clipboard is empty');
      } catch (_) {
        toast(text ? 'Host clipboard: ' + text.slice(0, 40) : 'Host clipboard is empty');
      }
    } catch (_) { toast('Clipboard unavailable'); }
  });

  // -- view controls -------------------------------------------------------
  $('zoom').addEventListener('change', (ev) => {
    zoomMode = ev.target.value;
    applyZoom();
    toast(zoomMode === 'auto' ? 'Scale: auto fit' : 'Scale: ' + Math.round(Number(zoomMode) * 100) + '%');
  });
  window.addEventListener('orientationchange', () => {
    if (zoomMode === 'auto') setTimeout(applyZoom, 150);
  });

  $('btnFull').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) { toast('Fullscreen blocked'); }
  });

  $('btnDisc').addEventListener('click', () => {
    connected = false;
    $('btnDisc').disabled = true;
    setStatus('Disconnected', 'error');
    showOverlay('Disconnected. Enter the password to reconnect.');
  });

  $('btnConnect').addEventListener('click', connect);
  pwInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') connect(); });
  $('btnForget').addEventListener('click', () => {
    sessionStorage.removeItem(STORE_KEY);
    password = '';
    pwInput.value = '';
    pwInput.focus();
    toast('Saved password cleared');
  });

  pwInput.value = password;
  if (password) {
    connected = true;
    $('btnDisc').disabled = false;
    setStatus('Connecting…', 'warn');
    loop();
  } else {
    showOverlay();
  }
})();
</script>
</body>
</html>

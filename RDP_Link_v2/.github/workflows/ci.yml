name: CI (v2)

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run security scans
        run: bash scripts/security-scan.sh

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyflakes
      - working-directory: app
        run: python -m pyflakes rdp_manager tests ubuntu_rdp_manager.py office_viewer.py
      - working-directory: app
        run: python -m pytest

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSIS and MinGW
        run: |
          choco install nsis mingw -y --no-progress
          "C:\ProgramData\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Windows installer
        run: pwsh -File packaging/build-windows.ps1 -NoOpen
      - name: Sign installer (optional)
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_BASE64) { Write-Host "No signing certificate configured"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "rdplink.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 dist/windows/RDPLink-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/RDPLink-setup.exe

  macos-notarize:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + sign + optional notarize
        run: bash packaging/build-macos.sh
      - name: Build installer package
        run: bash packaging/build-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/macos/RDPLink-macos.dmg
            dist/macos/RDPLink-installer.pkg

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and gomobile
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
      - name: Build Go core AAR
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          gomobile init
          bash packaging/build-android-core.sh
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/officerdp.keystore
          fi
      - name: Android debug + release build
        env:
          OFFICERDP_KEYSTORE_FILE: officerdp.keystore
          OFFICERDP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OFFICERDP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OFFICERDP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleDebug
          gradle assembleRelease
          gradle bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux tarball + Go binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg
          bash packaging/build-linux.sh
      - name: Build .deb
        run: bash packaging/build-linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            dist/linux/rdplink-linux-arm64.deb
            dist/linux/rdplink-linux-amd64.deb
